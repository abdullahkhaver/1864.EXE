
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17352A">
  <title>1864.EXE 2026 — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #17352A;
      color: #EEF1E9;
      font-family: 'Archivo', sans-serif;
      text-align: center;
      padding: 24px;
    }

    .container {
      max-width: 700px;
      width: 100%;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 65px;
    }

    .brand span,
    .highlight {
      color: #F4D35E;
    }

    .tag {
      display: inline-block;
      border: 1px solid rgba(244, 211, 94, .5);
      color: #F4D35E;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(65px, 13vw, 120px);
      font-weight: 900;
      line-height: .9;
      letter-spacing: -5px;
    }

    h1 span {
      color: #F4D35E;
    }

    .year {
      display: block;
      font-size: 32px;
      font-weight: 400;
      color: #B9C6BD;
      letter-spacing: 8px;
      margin-top: 15px;
    }

    .message {
      font-size: 19px;
      color: #B9C6BD;
      margin: 35px auto 25px;
      line-height: 1.7;
      max-width: 480px;
    }

    .event-info {
      color: #EEF1E9;
      font-size: 14px;
      margin-bottom: 35px;
    }

    .event-info strong {
      color: #F4D35E;
    }

    .footer {
      border-top: 1px solid rgba(238, 241, 233, .15);
      padding-top: 22px;
      color: #91A69A;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .brand { margin-bottom: 55px; }
      h1 { letter-spacing: -3px; }
      .message { font-size: 16px; }
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="brand">1864<span>.EXE</span> 2026</div>

    <div class="tag">Something is loading</div>

    <h1>
      COMING<br>
      <span>SOON.</span>
      <span class="year">2026</span>
    </h1>

    <p class="message">
      A new generation of ideas, innovation and technology
      is coming to GC Lahore. Get ready to build something extraordinary.
    </p>



    <div class="footer">
      Organised by IT Society · Government College Lahore
      <br><br>
      © 2026 1864.EXE
    </div>

  </main>
</body>
</html>
